.bindPopup(d.vehicles[r.vehicle]+' - trip '+r.trip+'<br>'+r.customers.length+' stops, '+r.km.toFixed(1)+' km, '+r.hours.toFixed(2)+' h, EUR '+r.cost.toFixed(2))
